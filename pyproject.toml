[project]
name = "coding-harness"
version = "0.2.0"
description = "Stage 2 coding harness: features across modules, bounded context, saved sessions"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["targets", "runs"]
